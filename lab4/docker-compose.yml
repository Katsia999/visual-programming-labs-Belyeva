services:
  n8n:
    image: n8nio/n8n:2.44.6
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Minsk
      GENERIC_TIMEZONE: Europe/Minsk
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ./runtime/n8n:/home/node/.n8n
      - ./runtime/data:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4.11
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./runtime/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
