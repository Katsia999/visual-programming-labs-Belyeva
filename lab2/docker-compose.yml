services:
  node-red:
    image: nodered/node-red:4.1.0
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./runtime/node-red:/data
    restart: unless-stopped
    depends_on:
      - mosquitto
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./runtime/mosquitto:/mosquitto/data
    restart: unless-stopped
